<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Up Stats</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: rgb(19, 204, 218);
            font-family: Arial, sans-serif;
        }

        .overlay {
            display: inline-block;
            width: 200px;
            box-sizing: border-box;
        }

        .main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .rank-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-icon {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .rank-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .season-stats {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .label {
            font-size: 8px;
            opacity: 0.8;
        }

        .rank-value {
            font-size: 17px;
            font-weight: bold;
        }

        .lp {
            font-size: 9px;
        }

        .win-loss {
            font-size: 17px;
            font-weight: bold;
        }

        .winrate {
            font-size: 9px;
        }

        #loading {
            opacity: 0.7;
        }

        #error {
            display: none;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div id="loading">
        Loading...
    </div>

    <div id="error">
        Unable to load stats
    </div>

    <div id="stats" style="display: none;"></div>

        <div id="main-row" style="display: none;">

            <div class="rank-container">
                <img id="rank-icon" class="rank-icon" src="" alt="Rank">

                <div class="rank-info">
                    <div class="label">Double Up</div>
                    <div class="rank-value" id="rank">-</div>
                    <div class="lp" id="lp">- LP</div>
                </div>
            </div>
            
            <div class="season-stats">
                <div class="label">Season W/L</div>
                <div class="win-loss" id="win-loss">-</div>
                <div class="winrate" id="winrate">-</div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadStats() {
    try {
        const response = await fetch("/api/stats");
        const rankIcon = document.getElementById("rank-icon");

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        rankIcon.src = `/static/ranks/${data.tier.toLowerCase()}.png`;

        document.getElementById("rank").textContent =
            `${data.tier} ${data.rank}`;

        document.getElementById("lp").textContent =
            `${data.lp} LP`;
            
        document.getElementById("win-loss").textContent =
            `${data.wins}-${data.losses}`;

        document.getElementById("winrate").textContent =
            `${data.winrate}%`;

        // document.getElementById("top2-rate").textContent =
        //     `${data.top2_rate}%`;

        // document.getElementById("average-placement").textContent =
        //     data.average_placement ?? "-";

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "none";
        document.getElementById("stats").style.display = "block";

    } catch (error) {
        console.error(error);

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
    }
}

loadStats();
setInterval(loadStats, 300000);
</script>

</body>
</html>
