<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Up Stats</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: rgb(19, 204, 218);
            font-family: Arial, sans-serif;
        }

        .overlay {
            display: inline-block;
            width: 450px;
            height: 110px;
            box-sizing: border-box;
            /* Background */
            background: rgba(12, 16, 24, 0.88);
            border-radius: 12px;

            /* Spacing */
            padding: 10px 12px;

            /* Optional subtle outline */
            border: 1px solid rgba(212, 175, 55, 0.555);
        }

        .main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .rank-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .player-name {
            font-size: 16px;
            white-space: nowrap;
        }

        .rank-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .season-stats {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .label {
            font-size: 16px;
            opacity: 0.8;
        }

        .rank-value {
            font-size: 28px;
            font-weight: bold;
        }

        .lp {
            font-size: 18px;
        }

        .win-loss {
            font-size: 28px;
            font-weight: bold;
        }

        .winrate {
            font-size: 18px;
        }


        /* Placement history */
        .placement-history {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
        }

        .placement {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box;
        }

        .placement.p1 {
            background: #c9a227;
            color: #101010;
        }

        .placement.p2 {
            background: #aab5c5;
            color: #101010;
        }

        .placement.p3,
        .placement.p4 {
            background: #258b91;
        }

        .placement.p5,
        .placement.p6 {
            background: #344355;
        }

        .placement.p7,
        .placement.p8 {
            background: #713b48;
        }

        .history-title {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 7px;
        }


        #loading {
            opacity: 0.7;
        }

        #error {
            display: none;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div id="loading">
        Loading...
    </div>

    <div id="error">
        Unable to load stats
    </div>

    <div id="stats" style="display: none;">

        <div class="main-row">

            <div class="rank-container">
                <img id="rank-icon" class="rank-icon" src="" alt="Rank">

                <div class="rank-info">
                    <div class="player-name" id="player-name">-</div>
                    <div class="rank-value" id="rank">-</div>
                    <div class="lp" id="lp">- LP</div>
                </div>
            </div>
            
            <div class="season-stats">
                <div class="label">Season W/L</div>
                <div class="win-loss" id="win-loss">-</div>
                <div class="winrate" id="winrate">-</div>
            </div>

            <div id="history-section" style="display: none;">
                <div class="history-title">LAST 10 PLACEMENTS</div>
                <div id="placement-history" class="placement-history"></div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadStats() {
    try {
        const params = new URLSearchParams(window.location.search);

        const gameName = params.get("gameName");
        const tagLine = params.get("tagLine");
        
        if (!gameName || !tagLine) {
            throw new Error("Missing gameName or tagLine");
        }

        const mode = (
            params.get("mode") || "doubleup"
        ).toLowerCase();

        const response = await fetch(
            `/api/stats?gameName=${encodeURIComponent(gameName)}` +
            `&tagLine=${encodeURIComponent(tagLine)}` +
            `&mode=${encodeURIComponent(mode)}`
        );

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        const rankIcon = document.getElementById("rank-icon");

        rankIcon.src = `/static/ranks/${data.tier.toLowerCase()}.png`;

        document.getElementById("player-name").textContent =
            data.riot_id;

        document.getElementById("rank").textContent =
            `${data.tier} ${data.rank}`;

        document.getElementById("lp").textContent =
            `${data.lp} LP`;
            
        document.getElementById("win-loss").textContent =
            `${data.wins}-${data.losses}`;

        document.getElementById("winrate").textContent =
            `${data.winrate}%`;

        const historySection =
        document.getElementById("history-section");

        const historyContainer =
            document.getElementById("placement-history");

        if (mode === "solo") {
            historyContainer.replaceChildren();

            (data.placements || []).forEach(placement => {
                const tile = document.createElement("div");

                tile.className = `placement p${placement}`;
                tile.textContent = placement;

                tile.title = `Placement: ${placement}`;

                historyContainer.appendChild(tile);
            });

            historySection.style.display = "block";
        } else {
            historySection.style.display = "none";
        }

        // document.getElementById("top2-rate").textContent =
        //     `${data.top2_rate}%`;

        // document.getElementById("average-placement").textContent =
        //     data.average_placement ?? "-";

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "none";
        document.getElementById("stats").style.display = "block";

    } catch (error) {
        console.error(error);

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
    }
}

loadStats();
setInterval(loadStats, 300000);
</script>

</body>
</html>
