<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Up Stats</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: rgb(19, 204, 218);
            font-family: Arial, sans-serif;
        }

        .overlay {
            display: inline-block;
        }

        .stat {
            margin: 4px 0;
        }

        .label {
            font-size: 12px;
            opacity: 0.7;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .rank-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .rank-info {
            display: flex;
            flex-direction: column;
        }

        .lp {
            font-size: 14px;
            opacity: 0.75;
        }

        #loading {
            opacity: 0.7;
        }

        #error {
            display: none;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div id="loading">
        Loading...
    </div>

    <div id="error">
        Unable to load stats
    </div>

    <div id="stats" style="display: none;">
<!-- 
        <div class="stat">
            <div class="label">RANK</div>
            <div class="value" id="rank">-</div>
        </div> -->

        <div class="rank-container">
            <img id="rank-icon" class="rank-icon" src="" alt="Rank">

            <div class="rank-info">
                <div class="label">RANK</div>
                <div class="value" id="rank">-</div>
                <div class="lp" id="lp">- LP</div>
            </div>
        </div>

        <div class="stat">
            <div class="label">GAMES</div>
            <div class="value" id="games">-</div>
        </div>

        <div class="stat">
            <div class="label">WIN RATE</div>
            <div class="value" id="winrate">-</div>
        </div>
<!-- 
        <div class="stat">
            <div class="label">TOP 2 RATE</div>
            <div class="value" id="top2-rate">-</div>
        </div>

        <div class="stat">
            <div class="label">AVERAGE PLACEMENT</div>
            <div class="value" id="average-placement">-</div>
        </div> -->

    </div>

</div>

<script>
async function loadStats() {
    try {
        const response = await fetch("/api/stats");
        const rankIcon = document.getElementById("rank-icon");

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        rankIcon.src = `/static/ranks/${data.tier.toLowerCase()}.png`;

        document.getElementById("rank").textContent =
            `${data.tier} ${data.rank}`;

        document.getElementById("lp").textContent =
            `${data.lp} LP`;

        document.getElementById("games").textContent =
            data.games;

        document.getElementById("winrate").textContent =
            `${data.win_rate}%`;

        // document.getElementById("top2-rate").textContent =
        //     `${data.top2_rate}%`;

        // document.getElementById("average-placement").textContent =
        //     data.average_placement ?? "-";

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "none";
        document.getElementById("stats").style.display = "block";

    } catch (error) {
        console.error(error);

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
    }
}

loadStats();
setInterval(loadStats, 300000);
</script>

</body>
</html>
